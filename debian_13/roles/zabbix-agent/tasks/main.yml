- block:
    - name: Install 'xz-utils' package
      package:
        state: present
        name:
          - xz-utils

    - name: Install Zabbix repo '{{ zabbix_repo_url }}'
      apt:
        deb: "{{ zabbix_repo_url }}"
        state: present

    - name: Update packages cache
      apt:
        update_cache: yes

    - name: Install zabbix-agent2 package
      package:
        state: latest
        name:
          - zabbix-agent2


    - block:
        - name: Setup Zabbix agent 'Hostname={{ hostname }}'
          lineinfile:
            dest: /etc/zabbix/zabbix_agent2.d/hostname.conf
            state: present
            create: yes
            regexp: '^Hostname='
            line: 'Hostname={{ hostname }}'
          notify: Restart and enable zabbix-agent2

        - name: Setup Zabbix agent 'Server={{ zabbix_server }}'
          lineinfile:
            dest: /etc/zabbix/zabbix_agent2.d/server.conf
            state: present
            create: yes
            regexp: '^Server='
            line: 'Server={{ zabbix_server }}'
          notify: Restart and enable zabbix-agent2

        - name: Setup Zabbix agent 'ServerActive={{ zabbix_server }}'
          lineinfile:
            dest: /etc/zabbix/zabbix_agent2.d/server_active.conf
            state: present
            create: yes
            regexp: '^ServerActive='
            line: 'ServerActive={{ zabbix_server }}'
          notify: Restart and enable zabbix-agent2
      when: hostname is defined and hostname != None
  when: zabbix_server is defined and zabbix_server != None and hostname is defined and hostname != None
